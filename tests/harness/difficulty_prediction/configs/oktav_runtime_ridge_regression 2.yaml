experiment_name: oktav_runtime_ridge_regression
dataset_name: oktav
input_matrix_path: tests/artifacts/oktav_dataset/python_analysis/full_run/oktav_labeled_feature_matrix.csv
id_columns:
  - catalog_index
  - catalog_key
  - filename
  - repo_relative_path
target_column: difficulty_numeric
target_scheme:
  kind: continuous
feature_set: runtime_all
excluded_columns:
  - overallDifficulty
preprocessing:
  imputer_strategy: median
  scaler: standard
model_family: ridge_regression
model_parameters:
  alpha: 1.0
cross_validation:
  kind: kfold
  folds: 5
  shuffle: true
  random_state: 42
output_options:
  primary_metric: rmse
  save_predictions: true
  save_confusion_matrix: false
  save_feature_importance: true
