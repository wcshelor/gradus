experiment_name: oktav_sebastian_7features_k3
dataset_name: oktav
input_matrix_path: tests/artifacts/oktav_dataset/og_export/full_run/og_full_dataset.csv
id_columns:
  - catalog_index
  - filename
  - repo_relative_path
  - oktav_code
label_column: difficulty_numeric
feature_columns:
  - speedDifficulty
  - displacementsDifficulty
  - chordsDifficulty
  - harmonyDifficulty
  - rhythmDifficulty
  - lengthDifficulty
  - tonalityDifficulty
excluded_columns:
  - overallDifficulty
preprocessing:
  missing_feature_strategy: median
  scaler: standard
pca:
  n_components: 2
clustering:
  method: ward_then_kmeans
  n_clusters: 3
  random_state: 42
  n_init: 20
output_options:
  run_name: oktav_sebastian_7features_k3
