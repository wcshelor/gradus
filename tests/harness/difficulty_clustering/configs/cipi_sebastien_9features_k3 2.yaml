experiment_name: cipi_sebastien_9features_k3
dataset_name: cipi
input_matrix_path: tests/artifacts/retired/cipi_og_export/full_cipi_run/og_full_dataset.csv
id_columns:
  - catalog_index
  - filename
  - repo_relative_path
  - oktav_code
label_column: henle
feature_set: sebastien_clustering
excluded_columns:
  - overallDifficulty
preprocessing:
  missing_feature_strategy: median
  scaler: standard
pca:
  n_components: 2
clustering:
  method: ward_then_kmeans
  n_clusters: 3
  random_state: 42
  n_init: 20
output_options:
  run_name: cipi_sebastien_9features_k3
