[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "piano-difficulty"
version = "0.1.0"
description = "Symbolic piano score descriptor extraction for difficulty analysis."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "partitura>=1.5",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[project.scripts]
piano-difficulty = "piano_difficulty.cli.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

