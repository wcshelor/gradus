experiment_name: oktav-sebastien-clustering-henle-9bin-dummy
dataset_name: oktav
input_matrix_path: tests/artifacts/oktav_dataset/og_export/full_run/og_full_dataset.csv
id_columns: [source_row_index, filename, dataset_relative_path]
target_column: difficulty_numeric
target_scheme:
  kind: custom_bins
  bin_edges: [11.0, 20.0, 23.0, 26.0, 34.0, 44.0, 47.333333333333314, 51.0, 56.0, 76.0]
  labels: [1, 2, 3, 4, 5, 6, 7, 8, 9]
feature_set: sebastien_clustering
preprocessing:
  imputer_strategy: median
  scaler: standard
model_family: dummy_classifier
model_parameters:
  strategy: most_frequent
cross_validation:
  kind: stratified
  folds: 5
  shuffle: true
  random_state: 42
output_options:
  run_name: oktav-sebastien-clustering-henle-9bin-dummy
  primary_metric: balanced_accuracy
  save_predictions: true
  save_confusion_matrix: true
  save_feature_importance: false

