experiment_name: cipi-runtime-dummy-9bin
dataset_name: cipi
input_matrix_path: tests/artifacts/cipi_dataset/python_analysis/full_run/cipi_labeled_feature_matrix.csv
id_columns: [source_row_index, filename, dataset_relative_path]
target_column: henle
target_scheme:
  kind: custom_bins
  bin_edges: [0.5, 1.5, 2.5, 3.5, 4.5, 5.5, 6.5, 7.5, 8.5, 9.5]
  labels: [1, 2, 3, 4, 5, 6, 7, 8, 9]
feature_set: runtime_all
preprocessing:
  imputer_strategy: median
  scaler: standard
model_family: dummy_classifier
model_parameters:
  strategy: most_frequent
cross_validation:
  kind: stratified
  folds: 5
  shuffle: true
  random_state: 42
output_options:
  run_name: cipi-runtime-dummy-9bin
  primary_metric: balanced_accuracy
  save_predictions: true
  save_confusion_matrix: true
  save_feature_importance: false
