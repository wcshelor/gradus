experiment_name: oktav-runtime-dummy-regression
dataset_name: oktav
input_matrix_path: tests/artifacts/oktav_dataset/python_analysis/full_run/oktav_labeled_feature_matrix.csv
id_columns: [source_row_index, filename, dataset_relative_path]
target_column: difficulty_numeric
target_scheme:
  kind: continuous
feature_set: runtime_all
preprocessing:
  imputer_strategy: median
  scaler: standard
model_family: dummy_regression
model_parameters:
  strategy: mean
cross_validation:
  kind: kfold
  folds: 5
  shuffle: true
  random_state: 42
output_options:
  run_name: oktav-runtime-dummy-regression
  primary_metric: r2
  save_predictions: true
  save_confusion_matrix: false
  save_feature_importance: false
